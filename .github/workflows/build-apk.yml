name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython==0.29.34"

      - name: Configure python-for-android
        run: |
          if grep -q "^p4a.branch" buildozer.spec; then
            sed -i 's/^p4a.branch.*/p4a.branch = develop/' buildozer.spec
          else
            sed -i '/^\[app\]/a p4a.branch = develop' buildozer.spec
          fi

          grep -n "p4a.branch" buildozer.spec

      - name: Initialize Android SDK
        run: |
          buildozer android debug || true

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== SDK LOCATION ====="
          ls -lah "$SDK" || true

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found."
            find "$SDK" -type f -name sdkmanager -print
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "build-tools;37.0.0"

      - name: Build APK
        env:
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          buildozer android debug

          echo "===== BUILD OUTPUT ====="
          ls -lah bin/

          echo "===== SEARCHING FOR APK ====="
          find . -type f -name "*.apk" -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK FOUND: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7