name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4

      - name: Install Buildozer and pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            python-for-android==2024.1.21

      - name: Accept Android SDK licenses and install Build Tools
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Using SDK Manager:"
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "Installing required Android SDK packages..."
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0"

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

      - name: Check AIDL
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          echo "Searching for AIDL..."

          if [ -f "$ANDROID_HOME/build-tools/37.0.0/aidl" ]; then
            echo "AIDL found:"
            echo "$ANDROID_HOME/build-tools/37.0.0/aidl"
            "$ANDROID_HOME/build-tools/37.0.0/aidl" --version || true
          else
            echo "AIDL was not found."
            find "$ANDROID_HOME" -name aidl -type f -print || true
            exit 1
          fi

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error