name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clear Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython==0.29.34"

      - name: Configure python-for-android
        run: |
          if grep -q "^p4a.branch" buildozer.spec; then
            sed -i 's/^p4a.branch.*/p4a.branch = develop/' buildozer.spec
          else
            sed -i '/^\[app\]/a p4a.branch = develop' buildozer.spec
          fi

          grep -n "p4a.branch" buildozer.spec

      - name: Setup Android SDK
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          
          # Download and install Android SDK
          cd /home/runner/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          # Install SDK packages
          yes | /home/runner/.buildozer/android/platform/cmdline-tools/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" \
            "ndk;25.1.8937393"

      - name: Build APK V.1
        env:
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug

          echo "===== BUILD OUTPUT ====="
          ls -lah bin/

          echo "===== SEARCHING FOR APK ====="
          find . -type f -name "*.apk" -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK FOUND: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
