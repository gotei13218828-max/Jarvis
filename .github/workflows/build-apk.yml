name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython==0.29.34"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d /tmp/android-cmdline

          mv /tmp/android-cmdline/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "===== ACCEPTING ANDROID LICENSES ====="

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "===== INSTALLING ANDROID PACKAGES ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "===== CHECKING BUILD TOOLS ====="

          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo "===== CHECKING AIDL ====="

          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          echo "AIDL FOUND SUCCESSFULLY"

      - name: Configure python-for-android
        run: |
          if grep -q "^p4a.branch" buildozer.spec; then
            sed -i \
              's/^p4a.branch.*/p4a.branch = develop/' \
              buildozer.spec
          else
            sed -i \
              '/^\[app\]/a p4a.branch = develop' \
              buildozer.spec
          fi

          echo "===== P4A BRANCH ====="
          grep -n "p4a.branch" buildozer.spec

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          echo "===== ANDROID SDK ====="
          ls -lah "$ANDROID_HOME"

          echo "===== BUILD TOOLS ====="
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo "===== AIDL CHECK ====="

          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aidl" ]; then
            echo "ERROR: AIDL not found."
            exit 1
          fi

          echo "AIDL FOUND SUCCESSFULLY"

          echo "===== STARTING BUILDOZER ====="

          buildozer android debug

          echo "===== BUILD OUTPUT ====="
          ls -lah bin/

          echo "===== SEARCHING FOR APK ====="
          find . -type f -name "*.apk" -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK FOUND: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7