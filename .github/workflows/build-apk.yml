name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            m4

      - name: Install Buildozer and pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            python-for-android==2024.1.21

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Check AIDL
        run: |
          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"
          if [ -f "$AIDL" ]; then
            echo "AIDL found: $AIDL"
            "$AIDL" --version || true
          else
            echo "AIDL not found at $AIDL"
            find "$ANDROID_HOME/build-tools" -name aidl -type f -print || true
          fi

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error