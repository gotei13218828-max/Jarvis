name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pin Cython to 0.29.36 to prevent recipe syntax failures in python-for-android C extensions
          python -m pip install "cython<3.0" buildozer

      - name: Check tool versions
        run: |
          java -version
          python -V
          cython -V
          buildozer --version

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Verify build artifacts
        if: always()
        run: |
          echo "===== BIN CONTENTS ====="
          ls -lah bin/ || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7