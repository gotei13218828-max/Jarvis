name: Build Jarvis Shell APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev liblzma-dev

      - name: Purge cached environments
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -f requirements.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip<26.0" setuptools wheel
          python -m pip install "cython<3.0" buildozer

      - name: Set pip constraint to prevent venv breakage
        run: |
          echo "pip<26.0" > pip_constraint.txt
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/pip_constraint.txt" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          buildozer appclean
          buildozer -v android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7