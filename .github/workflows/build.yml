name: build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer

      - name: Install compatible Cython
        run: |
          python -m pip install "Cython==0.29.34"

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Checking main.py:"
          test -f main.py

          echo "Checking buildozer.spec:"
          test -f buildozer.spec

          echo "Checking workflow:"
          test -f .github/workflows/build.yml

      - name: Show versions
        run: |
          python --version
          buildozer --version
          cython --version
          java -version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Show APK output
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7