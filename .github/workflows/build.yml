name: Build Jarvis APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/supabase-auth

jobs:
  build:
    name: Build Jarvis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev liblzma-dev librsvg2-bin

      - name: Generate Android launcher icon
        run: |
          mkdir -p assets
          rsvg-convert -w 512 -h 512 assets/jarvis_icon.svg > assets/jarvis_icon.png
          file assets/jarvis_icon.png

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install legacy-cgi setuptools Cython==0.29.34
          python -m pip install git+https://github.com/kivy/buildozer

      - name: Prepare build directory
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v1.0.3-Debug
          path: bin/*debug*.apk
          if-no-files-found: error

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          test -s "$RUNNER_TEMP/jarvis-release.jks"

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/jarvis-release.jks"
          test -n "$P4A_RELEASE_KEYSTORE_PASSWD"
          test -n "$P4A_RELEASE_KEYALIAS"
          test -n "$P4A_RELEASE_KEYALIAS_PASSWD"
          buildozer android release

      - name: Verify release APK signature
        run: |
          RELEASE_APK="$(find bin -type f -name '*release*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$RELEASE_APK"
          echo "Release APK signature verified."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v1.0.3-Release
          path: bin/*release*.apk
          if-no-files-found: error
